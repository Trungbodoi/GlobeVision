<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GlobeVision</title>
    <style>
  #initial-loader {
    position: fixed;
    inset: 0;
    z-index: 99999;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;
  }

  .initial-loader-content {
    width: min(420px, 80%);
    text-align: center;
  }

  .initial-loader-globe {
    font-size: 64px;
    margin-bottom: 16px;

    animation: initial-loader-spin 2s linear infinite;
  }

  .initial-loader-content h1 {
    margin: 0;
    color: white;
    font-size: 32px;
    font-weight: 600;
  }

  .initial-loader-content p {
    margin: 10px 0 24px;
    color: #aaa;
    font-size: 15px;
  }

  .initial-loader-bar {
    width: 100%;
    height: 8px;

    background: #222;
    border-radius: 10px;
    overflow: hidden;
  }

  .initial-loader-bar-fill {
    width: 15%;
    height: 100%;

    background: white;
    border-radius: 10px;

    animation: initial-loader-progress 2s ease-in-out infinite;
  }

  .initial-loader-percent {
    margin-top: 12px;

    color: white;
    font-size: 18px;
    font-weight: 600;
  }

  @keyframes initial-loader-spin {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }

  @keyframes initial-loader-progress {
    0% {
      width: 10%;
    }

    50% {
      width: 60%;
    }

    100% {
      width: 90%;
    }
  }
</style>

  </head>
<body>
  <!-- Loading xuất hiện ngay lập tức, trước khi React tải -->
  <div id="initial-loader">
    <div class="initial-loader-content">
      <div class="initial-loader-globe">🌍</div>
  <h1>GlobeVision</h1>

  <p>Đang khởi động...</p>

  <div class="initial-loader-bar">
    <div class="initial-loader-bar-fill"></div>
  </div>

  <div class="initial-loader-percent">0%</div>
</div>
  </div>

  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>

</body>

</html>
